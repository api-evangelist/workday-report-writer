  - type: Features
    data:
      - name: Custom Report Authoring
        description: >-
          Build custom reports using Report Writer with calculated fields, subfilters, and grouping across HCM and
          Financial Management data.
      - name: Report-as-a-Service Web Endpoints
        description: >-
          Expose any advanced custom report as a REST or SOAP web service returning JSON, CSV, XML, or RSS for
          programmatic consumption.
      - name: SQL-Like Data Access via WQL
        description: >-
          Query Workday data with SQL-like SELECT/FROM/WHERE/ORDER BY/LIMIT syntax against governed data sources for
          high-performance retrieval.
      - name: External Data Loading with Prism Analytics
        description: >-
          Programmatically create tables, upload compressed files via buckets, and run data change tasks (insert,
          update, upsert, delete) in Prism.
      - name: OAuth 2.0 Authentication
        description: >-
          Secure access to REST endpoints using OAuth 2.0 client credentials, refresh tokens, and bearer tokens managed
          through API client setup.
      - name: Multi-Format Output
        description: >-
          Retrieve report data in JSON, CSV, XML, RSS, and other formats with query parameter control over filtering,
          prompts, and pagination.
  - type: UseCases
    data:
      - name: HR Analytics and Workforce Reporting
        description: >-
          Extract headcount, compensation, and turnover metrics from Workday HCM for downstream analytics, dashboards,
          and board reporting.
      - name: Financial Reporting and Close
        description: >-
          Pull custom financial reports for general ledger, accounts payable, and budget variance analysis in support of
          period close processes.
      - name: Data Warehouse and Lake Hydration
        description: >-
          Schedule RaaS or WQL extracts to feed Snowflake, BigQuery, Redshift, Databricks, or other downstream systems
          with Workday data.
      - name: External Data Blending in Prism
        description: >-
          Load external CSV or Parquet datasets into Prism Analytics tables to combine with native Workday data for
          cross-source reporting.
      - name: Operational Integrations
        description: >-
          Drive payroll vendors, benefits providers, and identity systems with scheduled report extracts derived from
          Workday source-of-truth data.
      - name: Compliance and Audit Reporting
        description: >-
          Generate audit-ready extracts of personnel actions, journal entries, and security configurations for
          regulatory and SOX compliance.
  - type: Integrations
    data:
      - name: Snowflake
        description: Land Workday RaaS and WQL extracts into Snowflake stages for use in enterprise data warehouse pipelines.
      - name: Databricks
        description: Ingest Workday report data into Databricks for analytics, ML feature engineering, and lakehouse modeling.
      - name: Tableau
        description: >-
          Connect Tableau to RaaS endpoints or downstream warehouses to build interactive dashboards on Workday HCM and
          financial data.
      - name: Power BI
        description: Use RaaS JSON or CSV outputs as data sources for Microsoft Power BI reports and semantic models.
      - name: Workato
        description: >-
          Orchestrate Workday API calls in iPaaS workflows that move data between Workday and third-party SaaS
          applications.
      - name: SnapLogic
        description: Build integration pipelines using SnapLogic's Workday Snap Pack to read RaaS, WQL, and Prism endpoints.
      - name: Boomi
        description: Connect Workday APIs to ERP, CRM, and HRIS systems through Boomi AtomSphere integration processes.
  - type: Solutions
    data:
      - name: HCM Reporting
        description: End-to-end workforce and people analytics built on Report Writer, RaaS, and WQL across the Workday HCM suite.
      - name: Financial Management Reporting
        description: >-
          Custom financial reporting and extracts spanning ledgers, projects, procurement, and revenue across Workday
          Financial Management.
      - name: Prism Analytics
        description: >-
          Bring external data into Workday and combine with native data sets to deliver advanced analytics and
          self-service reporting.
